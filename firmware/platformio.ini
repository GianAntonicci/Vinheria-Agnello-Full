; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Ambiente de compilação e gravação para a placa física ESP32-S3 com framework Arduino.
[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; Seleciona LittleFS para operações de sistema de arquivos que venham a ser usadas no firmware.
board_build.filesystem = littlefs
; Velocidade do monitor serial, correspondente a Serial.begin(115200).
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0  ; Serial na porta UART (COM), a mesma usada para gravar
; Bibliotecas instaladas pelo PlatformIO para rede MQTT, sensores, gráficos e periféricos.
lib_deps =
    bblanchon/ArduinoJson
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    knolleary/PubSubClient
    adafruit/Adafruit GFX Library
    adafruit/Adafruit ILI9341
    adafruit/RTClib
